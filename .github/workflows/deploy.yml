name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Szükséges jogosultságok a GitHub Pages publikáláshoz
permissions:
  contents: read
  pages: write
  id-token: write

# Egyidejű futások kezelése
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése (Checkout)
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurálása
        uses: actions/configure-pages@v5

      - name: Weboldal feltöltése artifactként
        uses: actions/upload-pages-artifact@v3
        with:
          # A gyökérmappában lévő index.html és statikus fájlok publikálása
          path: '.'

      - name: Publikálás a GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
